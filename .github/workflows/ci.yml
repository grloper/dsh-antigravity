name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The catalog and its routing are pure data: no harness packages required.
      - name: Syntax check
        run: npm run check

      - name: Model catalog and routing tests
        run: npm test
